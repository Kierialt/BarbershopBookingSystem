<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie — BarberBook</title>
    <link rel="stylesheet" href="loginpage.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<script>
document.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const inputs = document.querySelectorAll("input");

    const data = {
        email: inputs[0].value,
        password: inputs[1].value
    };

    const response = await fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    if (response.ok) {
        alert("Zalogowano");
    } else {
        alert("Błąd logowania");
    }
});
</script>
<body>

    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="login-wrapper">

        <div class="login-left">
            <div class="logo">Barber<span>Book</span></div>

            <h1>Witaj ponownie</h1>

            <p>
                Zaloguj się do swojego konta i zarządzaj rezerwacjami,
                historią wizyt oraz ulubionymi salonami.
            </p>
        </div>

        <div class="login-box">
            <h2>Zaloguj się</h2>
            <p class="subtitle">Wprowadź dane logowania</p>

            <form>
                <div class="input-group">
                    <input type="email" placeholder="Adres e-mail" required>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Hasło" required>
                </div>

                <button type="submit" class="login-btn">Zaloguj się</button>
            </form>

            <div class="register-link">
                Nie masz konta? <a href="register.html">Zarejestruj się</a>
            </div>
        </div>

    </div>

</body>
</html>
