<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie — BarberBook</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="/loginpage/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="login-wrapper">

        <div class="login-left">
            <div class="logo">Barber<span>Book</span></div>

            <h1>Witaj ponownie</h1>

            <p>
                Zaloguj się do swojego konta i zarządzaj rezerwacjami,
                historią wizyt oraz ulubionymi salonami.
            </p>
        </div>

        <div class="login-box">
            <h2>Zaloguj się</h2>
            <p class="subtitle">Wprowadź dane logowania</p>

            <form>
                <div class="input-group">
                    <input type="email" placeholder="Adres e-mail" required>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Hasło" required>
                </div>

                <button type="submit" class="login-btn">Zaloguj się</button>
            </form>

            <div class="register-link">
                Nie masz konta? <a href="register.html">Zarejestruj się</a>
            </div>
        </div>

    </div>

    <script src="auth-config.js"></script>
    <script>
    document.querySelector("form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const base = window.BARBERSHOP_API || "http://localhost:5140";
        const inputs = document.querySelectorAll("form input");

        const data = {
            email: inputs[0].value.trim(),
            password: inputs[1].value
        };

        const response = await fetch(base + "/api/Auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        let message;
        try {
            const result = await response.json();
            if (response.ok) {
                if (result.token) {
                    localStorage.setItem("authToken", result.token);
                    localStorage.setItem("authUser", JSON.stringify({
                        email: result.email,
                        fullName: result.fullName,
                        userId: result.userId
                    }));
                }
                message = "Zalogowano pomyślnie.";
            } else
                message = result.error || result.title || "Błąd logowania.";
        } catch {
            message = response.ok ? "Zalogowano." : "Błąd sieci lub odpowiedzi serwera.";
        }
        alert(message);
    });
    </script>
</body>
</html>
