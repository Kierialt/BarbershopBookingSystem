<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>BarberBook — Miasta</title>

    <link rel="stylesheet" href="cities.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Barber<span>Book</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Strona główna</a></li>
                <li><a href="cities.html">Miasta</a></li>
                <li><a href="#">Kontakt</a></li>
            </ul>

            <div class="user-menu">
                <button class="user-btn">
                    <span class="user-icon"><img src="img/icon.png" alt=""></span>
                </button>
                <div class="dropdown-menu">
                </div>
            </div>

        </nav>

    </header>

    <!-- ================= PAGE ================= -->

    <section class="cities-page">

        <!-- LEFT -->

        <div class="cities-sidebar">

            <span class="sidebar-subtitle">
                MIASTA
            </span>

            <h2>
                Wybierz miasto
            </h2>

            <div class="city-buttons">
                <p class="loader">Ładowanie miast...</p>
            </div>

        </div>

        <!-- RIGHT -->

        <div class="barbershops-content">
            <div class="shop-list-container" id="shopList">
                <p class="loader">Ładowanie salonów...</p>
            </div>

            <!-- RESERVATION PANEL -->

            <div class="reservation-panel" id="reservationPanel">
                <span class="sidebar-subtitle">REZERWACJA</span>
                <h2>Zarezerwuj swój termin</h2>
                <div class="reservation-card" id="reservationCard">
                    <p class="empty-state">Kliknij salon opcji po lewej stronie, aby przejść do rezerwacji.</p>
                </div>
            </div>

        </div>

    </section>
    

    <script src="user-menu.js"></script>
    <script src="cities.js"></script>

</body>
</html>
